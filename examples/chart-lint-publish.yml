# Copy to .github/workflows/chart-lint-publish.yml in a module repo (MyPass), replacing its
# existing chart workflow. Charts are published to oci://ghcr.io/bhs-bs/charts.
name: Helm charts

on:
  pull_request:
    paths:
      - 'helm/**'
  push:
    branches:
      - develop
      - 'release*'
    paths:
      - 'helm/**'
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  helm-lint-publish:
    uses: BHS-BS/shared-workflow/.github/workflows/helm-lint-publish.yml@develop
    permissions:
      contents: read
      packages: write
    with:
      CHARTS_DIR: ./helm
      # IGNORE_CHARTS: "regproc-salt"
