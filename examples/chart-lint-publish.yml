# Copy to .github/workflows/chart-lint-publish.yml in a module repo, replacing the MOSIP
# kattu workflow (which published to mosip-helm with ACTION_PAT).
name: Helm charts

on:
  pull_request:
    paths:
      - 'helm/**'
  push:
    branches:
      - develop
      - 'release*'
    paths:
      - 'helm/**'
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  helm-chart:
    uses: BHS-BS/shared-workflow/.github/workflows/helm-chart.yml@develop
    permissions:
      contents: read
      packages: write
    with:
      CHARTS_DIR: ./helm
      # IGNORE_CHARTS: "regproc-salt"
