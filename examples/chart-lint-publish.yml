# Copy to .github/workflows/chart-lint-publish.yml in a module repo (MyPass), replacing its
# existing chart workflow. Each chart is published to oci://ghcr.io/bhs-bs/<chart>.
#
# - PR that changes helm/: lint + render every chart in helm/.
# - PR merged into develop or a release* branch with changes in helm/: lint, then publish the
#   charts in helm/ (all of them, not only the changed ones).
name: Helm charts

on:
  pull_request:
    paths:
      - 'helm/**'
  # Not main: a develop -> main merge would try to republish the same versions.
  push:
    branches:
      - develop
      - 'release*'
    paths:
      - 'helm/**'
  workflow_dispatch:

jobs:
  helm-lint-publish:
    uses: BHS-BS/shared-workflow/.github/workflows/helm-lint-publish.yml@develop
    permissions:
      contents: read
      packages: write
    with:
      CHARTS_DIR: ./helm
      # IGNORE_CHARTS: "softhsm"
