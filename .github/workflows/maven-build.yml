name: Reusable - Maven build

on:
  workflow_call:
    inputs:
      SERVICE_LOCATION:
        required: true
        type: string
      BUILD_ARTIFACT:
        required: true
        type: string
      JAVA_VERSION:
        default: "21"
        type: string
      DISTRIBUTION:
        default: "temurin"
        type: string
      MAVEN_NON_EXEC_ARTIFACTS:
        required: false
        type: string
      PACKAGE_TARGET_DIR:
        default: false
        type: boolean
      POST_BUILD_SCRIPT:
        required: false
        type: string

jobs:
  maven-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: ${{ inputs.DISTRIBUTION }}
          java-version: ${{ inputs.JAVA_VERSION }}
          cache: maven

      - name: Build with Maven
        run: cd ${{ inputs.SERVICE_LOCATION }} && mvn -U -B package --file pom.xml

      - name: Post-build script
        if: ${{ inputs.POST_BUILD_SCRIPT }}
        working-directory: ${{ inputs.SERVICE_LOCATION }}
        run: ${{ inputs.POST_BUILD_SCRIPT }}

      - name: Ready the springboot executable artifacts
        if: ${{ !inputs.PACKAGE_TARGET_DIR }}
        run: find ${{ inputs.SERVICE_LOCATION }} -path '*/target/*' -name '*.jar' -type f -executable -exec zip ${{ inputs.BUILD_ARTIFACT }}.zip {} +

      - name: Ready everything under target
        if: ${{ inputs.PACKAGE_TARGET_DIR }}
        run: find ${{ inputs.SERVICE_LOCATION }} -path '*/target/*' -type f -exec zip ${{ inputs.BUILD_ARTIFACT }}.zip {} +

      - name: Ready the springboot non-executable artifacts
        if: ${{ inputs.MAVEN_NON_EXEC_ARTIFACTS }}
        run: |
          IFS=',' read -ra ARTIFACTS <<< "${{ inputs.MAVEN_NON_EXEC_ARTIFACTS }}"
          for ARTIFACT in "${ARTIFACTS[@]}"; do
            BASE_NAME="$(echo "$ARTIFACT" | xargs)"
            BASE_NAME="${BASE_NAME%.jar}"
            find ${{ inputs.SERVICE_LOCATION }} -type f -path "*/target/${BASE_NAME}*.jar" ! -executable \
              | grep -Ev '(-sources|-javadoc|-tests)\.jar$' \
              | while read -r file; do zip ${{ inputs.BUILD_ARTIFACT }}.zip "$file"; done
          done

      - name: Upload the artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.BUILD_ARTIFACT }}
          path: ./${{ inputs.BUILD_ARTIFACT }}.zip
          if-no-files-found: error
          retention-days: 1
