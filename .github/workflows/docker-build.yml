name: Reusable - Docker build

on:
  workflow_call:
    inputs:
      SERVICE_LOCATION:
        required: true
        type: string
      SERVICE_NAME:
        required: true
        type: string
      # Optional: leave it out when the Dockerfile builds from source itself (e.g. a multi-stage
      # npm build), and no artifact is downloaded.
      BUILD_ARTIFACT:
        required: false
        type: string
        default: ''
      BASE_SERVICE_NAME:
        required: false
        type: string

jobs:
  docker-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        if: inputs.BUILD_ARTIFACT != ''
        with:
          name: ${{ inputs.BUILD_ARTIFACT }}

      - name: Restore the artifacts
        if: inputs.BUILD_ARTIFACT != ''
        run: unzip -o ${{ inputs.BUILD_ARTIFACT }}.zip

      - name: Set image name and build args
        id: vars
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image=ghcr.io/${owner}/${{ inputs.SERVICE_NAME }}" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          if [ -n "${{ inputs.BASE_SERVICE_NAME }}" ]; then
            # On a PR, use the base image of the target branch (e.g. develop), which already exists in GHCR.
            if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then branch="$GITHUB_BASE_REF"; else branch="$GITHUB_REF_NAME"; fi
            echo "base_arg=BASE_IMAGE=ghcr.io/${owner}/${{ inputs.BASE_SERVICE_NAME }}:${branch//\//-}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Branch push -> tag = branch name. Pull request -> pr-<number> (built only, never pushed).
      # A manual run started from a git tag -> that tag's name, so the tag list is never empty
      # (buildx fails with "tag is needed"). No sha-<short> tag: images are named by branch or tag only.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.vars.outputs.image }}
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=ref,event=tag

      # Pull requests: build only, to check the Dockerfile. Pushed to GHCR only after merge (branch push).
      - uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.SERVICE_LOCATION }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SOURCE=${{ github.repository }}
            COMMIT_HASH=${{ github.sha }}
            COMMIT_ID=${{ github.sha }}
            BUILD_TIME=${{ steps.vars.outputs.build_time }}
            ${{ steps.vars.outputs.base_arg }}