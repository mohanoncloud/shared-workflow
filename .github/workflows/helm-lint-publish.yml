name: Reusable - Helm chart lint and publish

# Lints the Helm charts of a repo and, when a PR is merged (a push to a branch), publishes them
# to GHCR as OCI artifacts, one package per chart, named after the chart:
#   oci://ghcr.io/<owner>/charts/<chart>:<version>   (e.g. ghcr.io/bhs-bs/charts/keymanager:0.0.1-develop)
# The charts/ path keeps charts apart from the images in ghcr.io/<owner>/<image>, so a chart and an
# image with the same name never share a package. Each chart is still its own package.
#
# - Pull request: if the PR changes any chart, lint + render every chart. Nothing is published.
# - Branch push (PR merged): if the push changed any chart, lint + render every chart in the
#   charts directory and publish them all. The caller chooses the branches and should filter on
#   its charts directory (paths: helm/**).
# - Manual run (workflow_dispatch) or tag push: lint + render all charts. Nothing is published.
#
# Publishing uses the caller's GITHUB_TOKEN (packages: write); no PAT is needed.
# A release version (no pre-release suffix, e.g. 1.3.0) is never overwritten:
#   - a chart changed by the push whose version already exists in GHCR fails the job before
#     anything is pushed, and asks for a version bump;
#   - an unchanged chart whose version already exists is skipped.
# A pre-release version (e.g. 1.3.0-develop) is overwritten.

on:
  workflow_call:
    inputs:
      # Directory holding one sub-directory per chart (each with a Chart.yaml).
      CHARTS_DIR:
        required: false
        type: string
        default: ./helm
      # Chart directory names to skip, separated by spaces, commas or pipes (e.g. "regproc-salt").
      IGNORE_CHARTS:
        required: false
        type: string
        default: ''
      # OCI path the charts are pushed under. Empty -> ghcr.io/<owner>/charts (each chart is ghcr.io/<owner>/charts/<chart>).
      CHART_REGISTRY_PATH:
        required: false
        type: string
        default: ''
      # Classic (non-OCI) chart repositories the dependencies come from, one "name=url" per line.
      # Needed only until every dependency is served from oci://ghcr.io/bhs-bs/charts (MP-196);
      # OCI dependencies need no entry here.
      DEPENDENCY_REPOS:
        required: false
        type: string
        default: |
          bitnami=https://charts.bitnami.com/bitnami
      HELM_VERSION:
        required: false
        type: string
        default: v3.17.3

jobs:
  helm-lint-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      CHARTS_DIR: ${{ inputs.CHARTS_DIR }}
      IGNORE_CHARTS: ${{ inputs.IGNORE_CHARTS }}
      DEPENDENCY_REPOS: ${{ inputs.DEPENDENCY_REPOS }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: azure/setup-helm@v4
        with:
          version: ${{ inputs.HELM_VERSION }}

      - name: Set registry path and publish flag
        id: vars
        env:
          CHART_REGISTRY_PATH: ${{ inputs.CHART_REGISTRY_PATH }}
        run: |
          path="${CHART_REGISTRY_PATH:-ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts}"
          path="${path#oci://}"
          echo "registry_path=${path}" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_TYPE" = "branch" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      # Changed charts come from the PR diff, or for a branch push from <before>..<sha> (for a merge,
      # everything the merged PR changed). If any chart changed, every chart in the charts directory
      # is checked (and published on a push), because the repo's charts are released together.
      # Manual runs, tags and pushes without a usable "before" commit (new branch): every chart.
      - name: Find charts
        id: charts
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          shopt -s nullglob
          charts_dir="${CHARTS_DIR%/}"
          ignore=" $(echo "$IGNORE_CHARTS" | tr ',|' '  ' | xargs) "
          range=""
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            range="origin/${BASE_REF}...HEAD"
          elif [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_TYPE" = "branch" ] \
               && [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            range="${BEFORE}..${GITHUB_SHA}"
          fi
          all=()
          for c in "${charts_dir}"/*/Chart.yaml; do
            name="$(basename "$(dirname "$c")")"
            if [[ "$ignore" == *" $name "* ]]; then echo "Skipping ignored chart: $name"; continue; fi
            all+=("$name")
          done
          changed=()
          if [ -n "$range" ]; then
            while read -r f; do
              name="${f#"${charts_dir#./}/"}"; name="${name%%/*}"
              [[ " ${all[*]} " == *" $name "* ]] && changed+=("$name")
            done < <(git diff --name-only "$range" -- "$charts_dir")
            changed=($(printf '%s\n' "${changed[@]}" | sort -u))
            echo "Charts changed in ${range}: ${changed[*]:-none}"
          else
            changed=("${all[@]}")
          fi
          charts=()
          [ ${#changed[@]} -gt 0 ] && charts=("${all[@]}")
          echo "Charts: ${charts[*]:-none}"
          echo "list=${charts[*]}" >> "$GITHUB_OUTPUT"
          echo "changed=${changed[*]}" >> "$GITHUB_OUTPUT"

      - name: Add dependency repositories
        if: steps.charts.outputs.list != ''
        run: |
          while IFS='=' read -r name url; do
            name="$(echo "$name" | xargs)"; url="$(echo "$url" | xargs)"
            [ -z "$name" ] && continue
            helm repo add "$name" "$url"
          done <<< "$DEPENDENCY_REPOS"
          helm repo update

      # Logged in before the dependency build too, so OCI dependencies in ghcr.io/bhs-bs/charts resolve.
      - name: Log in to GHCR
        if: steps.charts.outputs.list != ''
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Lint and render charts
        if: steps.charts.outputs.list != ''
        env:
          CHARTS: ${{ steps.charts.outputs.list }}
        run: |
          failed=()
          for name in $CHARTS; do
            dir="${CHARTS_DIR%/}/${name}"
            echo "::group::${name}"
            if helm dependency build "$dir" && helm lint "$dir" && helm template "$name" "$dir" > /dev/null; then
              echo "OK: ${name}"
            else
              failed+=("$name")
            fi
            echo "::endgroup::"
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "::error::Charts failed lint/render: ${failed[*]}"
            exit 1
          fi

      # All versions are checked before anything is pushed, so a release is never half published.
      - name: Check chart versions in GHCR
        id: versions
        if: steps.vars.outputs.publish == 'true' && steps.charts.outputs.list != ''
        env:
          CHARTS: ${{ steps.charts.outputs.list }}
          CHANGED: ${{ steps.charts.outputs.changed }}
          REGISTRY_PATH: ${{ steps.vars.outputs.registry_path }}
        run: |
          blocked=()
          publish=()
          for name in $CHARTS; do
            dir="${CHARTS_DIR%/}/${name}"
            chart_name="$(helm show chart "$dir" | yq '.name')"
            version="$(helm show chart "$dir" | yq '.version')"
            if helm show chart "oci://${REGISTRY_PATH}/${chart_name}" --version "$version" > /dev/null 2>&1; then
              if [[ "$version" == *-* ]]; then
                echo "::warning::${chart_name} ${version} exists; pre-release version, it will be overwritten."
              elif [[ " $CHANGED " == *" $name "* ]]; then
                echo "::error::${chart_name} ${version} is already published. Bump the version in ${dir}/Chart.yaml."
                blocked+=("${chart_name}:${version}")
                continue
              else
                echo "::notice::${chart_name} ${version} is already published and the chart did not change; skipped."
                continue
              fi
            fi
            publish+=("$name")
          done
          [ ${#blocked[@]} -eq 0 ] || exit 1
          echo "Publishing: ${publish[*]:-none}"
          echo "list=${publish[*]}" >> "$GITHUB_OUTPUT"

      - name: Package and push charts
        if: steps.vars.outputs.publish == 'true' && steps.versions.outputs.list != ''
        env:
          CHARTS: ${{ steps.versions.outputs.list }}
          REGISTRY_PATH: ${{ steps.vars.outputs.registry_path }}
        run: |
          mkdir -p "$RUNNER_TEMP/charts"
          for name in $CHARTS; do
            helm package "${CHARTS_DIR%/}/${name}" --destination "$RUNNER_TEMP/charts"
          done
          {
            echo "### Published Helm charts"
            echo
            echo "| Chart | Version | Install |"
            echo "| --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          for pkg in "$RUNNER_TEMP"/charts/*.tgz; do
            helm push "$pkg" "oci://${REGISTRY_PATH}"
            chart_name="$(helm show chart "$pkg" | yq '.name')"
            version="$(helm show chart "$pkg" | yq '.version')"
            echo "| ${chart_name} | ${version} | \`helm install ${chart_name} oci://${REGISTRY_PATH}/${chart_name} --version ${version}\` |" >> "$GITHUB_STEP_SUMMARY"
          done
